<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Về Nhà 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Mục 2: Thêm thẻ neo ở đầu tệp để liên kết đến nội dung chính -->
    <a href="#main-content" class="skip-link">Chuyển đến nội dung chính</a>

    <header>
        <h1>Chào Mừng Đến Với Bài Tập 2</h1>
        <nav>
            <!-- Thêm ảnh vào trong nav để phục vụ mục số 5 -->
            <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=100" alt="Logo">
            <ul>
                <li><a href="#">Trang chủ</a></li>
                <li><a href="#">Thực đơn</a></li>
                <li><a href="#">Liên hệ</a></li>
            </ul>
        </nav>
    </header>

    <!-- Mục 2: Thêm id="main-content" vào thẻ main -->
    <main id="main-content">
        
        <!-- Phục vụ mục 6 và 8: Lớp grid chứa các hình ảnh -->
        <section class="grid">
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=300" alt="Món ăn 1">
                <p>Món ăn ngon số 1</p>
            </div>
            <div class="grid-item">
                <img src="https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=300" alt="Món ăn 2">
                <p>Món ăn ngon số 2</p>
            </div>
        </section>

        <!-- Phục vụ mục 9: Lớp flex -->
        <section class="flex">
            <div class="flex-item">Thành phần Flex 1</div>
            <div class="flex-item">Thành phần Flex 2</div>
            <div class="flex-item">Thành phần Flex 3</div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 - Thiết kế bởi Hiền Minh Nguyễn</p>
    </footer>

</body>
</html>
